name: Cardfolio live production probe

on:
  push:
    branches:
      - cardfolio-mvp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRODUCTION_URL: https://saad-cardfolio-saadahmed0020-3481s-projects.vercel.app
      EXPECTED_SUPABASE_URL: https://tvxwzkununcwxiwvrslh.supabase.co
    steps:
      - uses: actions/checkout@v5

      - name: Probe canonical Vercel surfaces
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          root="$(mktemp)"
          proxied_index="$(mktemp)"
          config="$(mktemp)"
          remote="$(mktemp)"
          auth_settings="$(mktemp)"
          oauth_headers="$(mktemp)"
          assets_file="$(mktemp)"
          trap 'rm -f "$headers" "$root" "$proxied_index" "$config" "$remote" "$auth_settings" "$oauth_headers" "$assets_file"' EXIT

          # The canonical domain intentionally serves a tiny stable bootstrap that opens
          # the current cardfolio-mvp index through /api/proxy. Verify both layers.
          root_status="$(curl -sS -L --connect-timeout 8 --max-time 20 -D "$headers" -o "$root" -w '%{http_code}' "$PRODUCTION_URL/" || true)"
          echo "root HTTP: ${root_status:-curl-error}"
          echo "root bytes: $(wc -c < "$root" | tr -d ' ')"
          grep -Ei '^(x-vercel-id|x-matched-path|content-type):' "$headers" || true
          test "$root_status" = "200"
          grep -Fq "location.replace('/api/proxy?path=index.html')" "$root"
          echo "root proxy bootstrap: verified"

          proxy_index_status="$(curl -sS -L --connect-timeout 8 --max-time 20 -o "$proxied_index" -w '%{http_code}' "$PRODUCTION_URL/api/proxy?path=index.html&sha=$GITHUB_SHA" || true)"
          echo "proxied index HTTP: ${proxy_index_status:-curl-error}"
          test "$proxy_index_status" = "200"
          grep -Fq '<title>Cardfolio</title>' "$proxied_index"
          local_index_sha="$(sha256sum index.html | awk '{print $1}')"
          remote_index_sha="$(sha256sum "$proxied_index" | awk '{print $1}')"
          echo "local index SHA-256:  $local_index_sha"
          echo "proxy index SHA-256:  $remote_index_sha"
          test "$local_index_sha" = "$remote_index_sha"

          # /api/config is serverless state owned by the canonical Vercel shell. It must
          # satisfy the same fail-closed vision contract as branch source; a stale 200 is a failure.
          : > "$headers"
          config_status="$(curl -sS -L --connect-timeout 8 --max-time 20 -D "$headers" -o "$config" -w '%{http_code}' "$PRODUCTION_URL/api/config?sha=$GITHUB_SHA" || true)"
          echo "api/config HTTP: ${config_status:-curl-error}"
          grep -Ei '^(x-vercel-id|x-matched-path|cache-control|content-type):' "$headers" || true
          test "$config_status" = "200"
          CONFIG_FILE="$config" EXPECTED_SUPABASE_URL="$EXPECTED_SUPABASE_URL" node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync(process.env.CONFIG_FILE, 'utf8');
          let cfg;
          try {
            cfg = JSON.parse(raw);
          } catch {
            console.error('api/config must return valid JSON');
            process.exit(1);
          }

          if (/service[_-]?role|SUPABASE_SERVICE_ROLE/i.test(raw)) {
            console.error('Privileged Supabase credential reference exposed by /api/config');
            process.exit(1);
          }

          // Print keys only, never config values/credentials.
          console.log('api/config keys:', Object.keys(cfg).sort().join(','));
          const valid = {
            configured: cfg.configured === true,
            supabaseUrl: cfg.supabaseUrl === process.env.EXPECTED_SUPABASE_URL,
            publishableKey: typeof cfg.supabasePublishableKey === 'string' && cfg.supabasePublishableKey.startsWith('sb_publishable_'),
            visionBackend: cfg.visionBackend === 'expert-queue',
            paidVisionFallback: cfg.paidVisionFallback === false,
            noServiceRole: !('supabaseServiceRoleKey' in cfg) && !('serviceRoleKey' in cfg) && !('SUPABASE_SERVICE_ROLE_KEY' in cfg)
          };
          console.log('api/config verification:', JSON.stringify(valid));
          if (!Object.values(valid).every(Boolean)) process.exit(1);
          NODE

          mapfile -t public_auth < <(CONFIG_FILE="$config" node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync(process.env.CONFIG_FILE, 'utf8'));
          console.log(cfg.supabaseUrl || '');
          console.log(cfg.supabasePublishableKey || '');
          NODE
          )
          supabase_url="${public_auth[0]:-}"
          publishable_key="${public_auth[1]:-}"
          test "$supabase_url" = "$EXPECTED_SUPABASE_URL"
          test -n "$publishable_key"

          auth_settings_status="$(curl -sS --connect-timeout 8 --max-time 20 \
            -H "apikey: $publishable_key" \
            -o "$auth_settings" -w '%{http_code}' \
            "$supabase_url/auth/v1/settings" || true)"
          echo "Supabase auth settings HTTP: ${auth_settings_status:-curl-error}"
          test "$auth_settings_status" = "200"
          AUTH_SETTINGS_FILE="$auth_settings" node <<'NODE'
          const fs = require('fs');
          let settings;
          try {
            settings = JSON.parse(fs.readFileSync(process.env.AUTH_SETTINGS_FILE, 'utf8'));
          } catch {
            console.error('Supabase auth settings must be valid JSON');
            process.exit(1);
          }
          const googleEnabled = settings?.external?.google === true;
          console.log(`Google provider enabled: ${googleEnabled}`);
          if (!googleEnabled) process.exit(1);
          NODE

          oauth_target="$PRODUCTION_URL/api/proxy?path=index.html"
          : > "$oauth_headers"
          oauth_status="$(curl -sS --connect-timeout 8 --max-time 20 --max-redirs 0 \
            -H "apikey: $publishable_key" \
            -D "$oauth_headers" -o /dev/null -w '%{http_code}' \
            --get --data-urlencode 'provider=google' --data-urlencode "redirect_to=$oauth_target" \
            "$supabase_url/auth/v1/authorize" || true)"
          echo "Google OAuth launch HTTP: ${oauth_status:-curl-error}"
          test "$oauth_status" = "302"
          oauth_location="$(grep -i '^location:' "$oauth_headers" | tail -n1 | sed -E 's/^[Ll]ocation:[[:space:]]*//' | tr -d '\r')"
          case "$oauth_location" in
            https://accounts.google.com/*|https://accounts.googleusercontent.com/*)
              echo 'Google OAuth provider launch: verified'
              ;;
            *)
              echo 'Google OAuth did not redirect to a Google authorization endpoint.' >&2
              exit 1
              ;;
          esac

          # Discover browser-delivered local CSS/JS/manifest assets from the exact live index.
          # This prevents a new asset (for example cardfolio-market-v2.css) from being omitted
          # from the production gate simply because a static workflow list was not updated.
          INDEX_FILE="$proxied_index" node <<'NODE' > "$assets_file"
          const fs = require('fs');
          const html = fs.readFileSync(process.env.INDEX_FILE, 'utf8');
          const refs = [];
          for (const m of html.matchAll(/<(?:script|link)\b[^>]*(?:src|href)="([^"]+)"[^>]*>/gi)) {
            const value = m[1];
            if (!value.startsWith('/')) continue;
            if (value.startsWith('/api/cardfolio-icon')) continue; // dynamic image endpoint, tested elsewhere
            refs.push(value);
          }
          for (const value of [...new Set(refs)]) console.log(value);
          NODE

          echo 'live index asset audit:'
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            local_path=''
            if [[ "$ref" == /api/proxy\?path=* ]]; then
              local_path="${ref#*path=}"
              local_path="${local_path%%&*}"
            else
              local_path="${ref%%\?*}"
              local_path="${local_path#/}"
            fi

            # Only byte-compare files that are actually owned by this branch.
            if [ -z "$local_path" ] || [ ! -f "$local_path" ]; then
              echo "SKIP dynamic/non-repo $ref"
              continue
            fi

            matched=no
            for asset_attempt in 1 2 3 4 5 6; do
              : > "$headers"
              status="$(curl -sS -L --connect-timeout 8 --max-time 20 -D "$headers" -o "$remote" -w '%{http_code}' "$PRODUCTION_URL$ref" || true)"
              content_type="$(grep -i '^content-type:' "$headers" | tail -n1 | tr -d '\r' | cut -d' ' -f2- || true)"
              if [ "$status" = "200" ] && [ "$(sha256sum "$local_path" | awk '{print $1}')" = "$(sha256sum "$remote" | awk '{print $1}')" ]; then
                matched=yes
                printf 'OK %s -> %s (%s)\n' "$ref" "$local_path" "${content_type:-?}"
                break
              fi
              printf 'WAIT %s attempt=%s HTTP=%s type=%s\n' "$ref" "$asset_attempt" "${status:-curl-error}" "${content_type:-?}"
              [ "$asset_attempt" -eq 6 ] || sleep 5
            done
            if [ "$matched" != yes ]; then
              echo "Production asset mismatch after bounded propagation retries: $ref -> $local_path" >&2
              exit 1
            fi
          done < "$assets_file"

          echo 'Cardfolio production probe passed with fail-closed config + exact asset verification.'
