name: Cardfolio quality gate

on:
  pull_request:
  push:
    branches:
      - cardfolio-mvp
      - main

permissions:
  contents: read

jobs:
  validate-cardfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in cardfolio-app.js cardfolio-app-2.js cardfolio-app-3.js cardfolio-app-4.js cardfolio-fixes.js cardfolio-watchlist.js cardfolio-watchlists-v2.js cardfolio-watchlists-ios-guard.js cardfolio-grading.js cardfolio-valuation-integrity.js cardfolio-scan-review.js cardfolio-vnext.js cardfolio-product.js cardfolio-product-fixes.js cardfolio-runtime-hardening.js cardfolio-critical-fixes.js cardfolio-commercial.js cardfolio-identity-persistence.js cardfolio-exact-identity-client.js cardfolio-production-guard.js cardfolio-market-integrity.js cardfolio-sw.js; do
            test -f "$file"
            node --check "$file"
          done

      - name: Validate Cardfolio PWA shell
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f cardfolio.css
          test -f cardfolio-vnext.css
          test -f cardfolio-liquid.css
          test -f cardfolio-manifest.webmanifest
          test -f cardfolio-brand.png
          grep -Fq 'cardfolio-manifest.webmanifest' index.html
          ! grep -Fq 'cardfolio-brand.png' index.html
          grep -Fq 'id="cardfolioBoot"' index.html
          grep -Fq 'cardfolio-booting' index.html
          grep -Fq 'Loading Cardfolio' index.html
          grep -Fq 'cardfolio-app.js' index.html
          grep -Fq 'cardfolio-fixes.js' index.html
          grep -Fq 'cardfolio-watchlists-v2.js' index.html
          grep -Fq 'cardfolio-watchlists-ios-guard.js' index.html
          ! grep -Fq 'src="/cardfolio-watchlist.js"' index.html
          grep -Fq 'cardfolio-grading.js' index.html
          grep -Fq 'cardfolio-valuation-integrity.js' index.html
          grep -Fq 'cardfolio-scan-review.js' index.html
          grep -Fq 'cardfolio-vnext.css' index.html
          grep -Fq 'cardfolio-vnext.js' index.html
          grep -Fq 'cardfolio-liquid.css' index.html
          grep -Fq 'cardfolio-product.js' index.html
          grep -Fq 'cardfolio-product-fixes.js' index.html
          grep -Fq 'cardfolio-runtime-hardening.js' index.html
          grep -Fq 'cardfolio-critical-fixes.js' index.html
          grep -Fq 'cardfolio-exact-identity-client.js' index.html
          grep -Fq 'cardfolio-production-guard.js' index.html
          grep -Fq 'cardfolio-sw.js' cardfolio-app.js
          grep -Fq 'cardfolio-vnext.css' cardfolio-sw.js
          grep -Fq 'cardfolio-liquid.css' cardfolio-sw.js
          grep -Fq 'cardfolio-app.js' cardfolio-sw.js
          grep -Fq 'cardfolio-app-4.js' cardfolio-sw.js
          grep -Fq 'cardfolio-brand.png' cardfolio-sw.js
          grep -Fq "cardfolio-shell-v21" cardfolio-sw.js
          node -e "JSON.parse(require('fs').readFileSync('cardfolio-manifest.webmanifest','utf8'))"

      - name: Validate Vercel production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f vercel.json
          test -f api/config.js
          test -f api/ebay.js
          node --check api/config.js
          node --check api/ebay.js
          grep -Fq 'Strict-Transport-Security' vercel.json
          grep -Fq 'X-Content-Type-Options' vercel.json
          grep -Fq 'Referrer-Policy' vercel.json
          grep -Fq 'Permissions-Policy' vercel.json
          grep -Fq 'camera=(self)' vercel.json
          grep -Fq 'tvxwzkununcwxiwvrslh.supabase.co' api/config.js
          grep -Fq 'SUPABASE_PUBLISHABLE_KEY' api/config.js
          grep -Fq 'SUPABASE_ANON_KEY' api/config.js
          grep -Fq 'EBAY_CLIENT_ID' api/ebay.js
          grep -Fq 'EBAY_CLIENT_SECRET' api/ebay.js

      - name: Enforce reproducible browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '@supabase/supabase-js@2.115.0' cardfolio-app.js
          grep -Fq 'import(SUPABASE_BROWSER_MODULE)' cardfolio-fixes.js
          grep -Fq 'tesseract.js@5.1.1/dist/tesseract.min.js' cardfolio-app-4.js
          ! grep -Fq 'tesseract.min.js' index.html
          grep -Fq 'ensureTesseract' cardfolio-app-4.js
          if grep -Fq "@supabase/supabase-js@2'" cardfolio-*.js; then
            echo 'Floating Supabase JS major-version import found.' >&2
            exit 1
          fi
          if grep -Fq 'tesseract.js@5/dist/' cardfolio-app-4.js; then
            echo 'Floating Tesseract v5 import found.' >&2
            exit 1
          fi

      - name: Validate backend and database assets
        shell: bash
        run: |
          set -euo pipefail
          test -f api/config.js
          test -f api/ebay.js
          test -f supabase/cardfolio_schema.sql
          test -f supabase/cardfolio_search.sql
          test -f supabase/cardfolio_private_provider_status.sql
          test -f supabase/cardfolio_atomic_valuation.sql
          test -f supabase/cardfolio_canonical_market.sql
          test -f supabase/cardfolio_market_v2.sql
          test -f supabase/cardfolio_market_v2_hardening.sql
          test -f supabase/cardfolio_market_pricing_engine.sql
          test -f supabase/cardfolio_research_commit_pipeline.sql
          test -f supabase/cardfolio_real_historical_sales_series.sql
          test -f supabase/cardfolio_shared_market_readonly_grants.sql
          grep -Fq 'alter table public.card_holdings enable row level security' supabase/cardfolio_schema.sql
          grep -Fq 'holdings_select_own' supabase/cardfolio_schema.sql
          grep -Fq 'watchlist_select_own' supabase/cardfolio_schema.sql
          grep -Fq "public = false" supabase/cardfolio_schema.sql
          grep -Fq 'security invoker' supabase/cardfolio_search.sql
          grep -Fq 'from anon' supabase/cardfolio_search.sql
          grep -Fq 'alter table public.provider_status set schema private' supabase/cardfolio_private_provider_status.sql
          grep -Fq 'security invoker' supabase/cardfolio_atomic_valuation.sql
          grep -Fq 'set_holding_valuation' supabase/cardfolio_atomic_valuation.sql
          grep -Fq 'canonical_cards' supabase/cardfolio_canonical_market.sql
          grep -Fq 'resolve_canonical_card' supabase/cardfolio_canonical_market.sql
          grep -Fq 'cardfolio_propagate_canonical_price' supabase/cardfolio_canonical_market.sql
          grep -Fq 'card_variant_catalog' supabase/cardfolio_market_v2.sql
          grep -Fq 'card_market_research_runs' supabase/cardfolio_market_v2.sql
          grep -Fq 'cardfolio_family_key' supabase/cardfolio_market_v2.sql
          grep -Fq 'cardfolio_identity_key_v2' supabase/cardfolio_market_v2_hardening.sql
          grep -Fq 'private.resolve_canonical_card_internal' supabase/cardfolio_market_v2_hardening.sql
          grep -Fq 'security invoker' supabase/cardfolio_market_v2_hardening.sql
          grep -Fq 'card_variant_catalog_canonical_card_idx' supabase/cardfolio_market_v2_hardening.sql
          grep -Fq 'private.reprice_card_from_observations' supabase/cardfolio_market_pricing_engine.sql
          grep -Fq "source_kind='sold'" supabase/cardfolio_market_pricing_engine.sql
          grep -Fq '10% trimmed mean' supabase/cardfolio_market_pricing_engine.sql
          grep -Fq 'observation_fingerprint' supabase/cardfolio_research_commit_pipeline.sql
          grep -Fq 'cardfolio_commit_research_result' supabase/cardfolio_research_commit_pipeline.sql
          grep -Fq 'rebuild_card_history_from_sales' supabase/cardfolio_real_historical_sales_series.sql
          grep -Fq "series_kind in ('valuation','sold_bucket')" supabase/cardfolio_real_historical_sales_series.sql
          grep -Fq 'revoke all privileges on table public.canonical_cards' supabase/cardfolio_shared_market_readonly_grants.sql

      - name: Prevent privileged Supabase keys in browser files
        shell: bash
        run: |
          set -euo pipefail
          if grep -Ein 'service[_-]?role|SUPABASE_SERVICE_ROLE' index.html cardfolio-*.js cardfolio*.css cardfolio-manifest.webmanifest; then
            echo 'Privileged Supabase credential reference found in browser-delivered files.' >&2
            exit 1
          fi

      - name: Enforce market-integrity invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Active listings only' cardfolio-app-4.js
          grep -Fq 'not a sold comp' cardfolio-app-4.js
          grep -Fq 'does not scrape closed marketplaces' cardfolio-fixes.js
          grep -Fq 'never counted in portfolio value' cardfolio-watchlist.js
          grep -Fq 'Verification ≠ guaranteed authenticity' cardfolio-grading.js
          grep -Fq 'Pending Price' cardfolio-vnext.js
          grep -Fq 'No synthetic backfill' cardfolio-vnext.js
          grep -Fq 'exact-card market records' cardfolio-vnext.js
          grep -Fq 'price research queued' cardfolio-product.js
          grep -Fq 'canonical_price_history' cardfolio-product.js
          grep -Fq 'card_market_observations' cardfolio-product.js
          grep -Fq 'force' cardfolio-product-fixes.js
          grep -Fq 'canonical re-resolution' cardfolio-product-fixes.js
          grep -Fq 'resolve_canonical_card' cardfolio-runtime-hardening.js
          grep -Fq 'BarcodeDetector' cardfolio-runtime-hardening.js
