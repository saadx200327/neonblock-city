<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090b10" />
  <meta name="description" content="Cardfolio — scan physical collectible cards into an honest, source-aware portfolio." />
  <title>Cardfolio</title>
  <link rel="manifest" href="/cardfolio-manifest.webmanifest" />
  <link rel="preconnect" href="https://api.tcgdex.net" />
  <link rel="stylesheet" href="/cardfolio.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script defer src="/cardfolio-app.js"></script>
  <script defer src="/cardfolio-app-2.js"></script>
  <script defer src="/cardfolio-app-3.js"></script>
  <script defer src="/cardfolio-app-4.js"></script>
  <script defer src="/cardfolio-fixes.js"></script>
  <script defer src="/cardfolio-watchlist.js"></script>
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <button class="brand" data-view="home" aria-label="Cardfolio home">
        <span class="brand-mark">C</span><span>Cardfolio</span>
      </button>
      <nav class="side-nav">
        <button data-view="home" class="nav-item active"><span>⌂</span><span>Home</span></button>
        <button data-view="portfolio" class="nav-item"><span>▦</span><span>Portfolio</span></button>
        <button data-view="scan" class="nav-item"><span>◎</span><span>Scan</span></button>
        <button data-view="watchlist" class="nav-item"><span>☆</span><span>Watchlist</span></button>
        <button data-view="market" class="nav-item"><span>↗</span><span>Market</span></button>
        <button data-view="grading" class="nav-item"><span>◇</span><span>Grading</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div id="backendBadge" class="status-pill neutral">Local Vault</div>
        <button data-view="profile" class="nav-item"><span>○</span><span>Profile</span></button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><div class="eyebrow" id="viewEyebrow">Portfolio intelligence</div><h1 id="viewTitle">Home</h1></div>
        <div class="top-actions"><button id="quickAdd" class="btn secondary">Manual add</button><button id="authButton" class="btn primary">Sign in</button></div>
      </header>
      <section id="content" class="content" tabindex="-1"></section>
    </main>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button data-view="home" class="active"><span>⌂</span><small>Home</small></button>
      <button data-view="portfolio"><span>▦</span><small>Portfolio</small></button>
      <button data-view="scan" class="scan-tab"><span>◎</span><small>Scan</small></button>
      <button data-view="watchlist"><span>☆</span><small>Watch</small></button>
      <button data-view="market"><span>↗</span><small>Market</small></button>
    </nav>
  </div>
  <dialog id="authDialog" class="modal">
    <form method="dialog" class="modal-card" id="authForm">
      <div class="modal-head"><div><div class="eyebrow">Cloud sync</div><h2>Sign in to Cardfolio</h2></div><button class="icon-btn" value="cancel" aria-label="Close">×</button></div>
      <p id="authExplainer" class="muted">Use a Cardfolio account to keep your private portfolio and watchlist synced across devices. Local Vault remains available without signing in.</p>
      <label>Email<input id="authEmail" type="email" autocomplete="email" required /></label>
      <label>Password<input id="authPassword" type="password" autocomplete="current-password" minlength="6" required /></label>
      <div class="button-row"><button type="button" id="loginBtn" class="btn primary">Sign in</button><button type="button" id="signupBtn" class="btn secondary">Create account</button></div>
      <div id="authState" class="inline-note"></div>
    </form>
  </dialog>
  <dialog id="cardDialog" class="modal wide">
    <form method="dialog" class="modal-card" id="cardForm">
      <div class="modal-head"><div><div class="eyebrow">Holding</div><h2 id="cardDialogTitle">Add card</h2></div><button class="icon-btn" value="cancel" aria-label="Close">×</button></div>
      <input type="hidden" id="cardId" />
      <div class="form-grid">
        <label>Category<select id="category"><option>Pokémon</option><option>Basketball</option><option>Soccer</option><option>Baseball</option><option>Football</option><option>Hockey</option><option>WNBA</option><option>UFC / MMA</option><option>Wrestling</option><option>Formula 1</option><option>NASCAR</option><option>College</option><option>Other</option></select></label>
        <label>Player / character<input id="subject" maxlength="120" required /></label>
        <label>Year<input id="year" maxlength="12" placeholder="2025-26" /></label>
        <label>Manufacturer<input id="manufacturer" maxlength="80" placeholder="Topps, Panini, Pokémon…" /></label>
        <label>Brand / product<input id="brand" maxlength="100" placeholder="Prizm, Chrome, Select…" /></label>
        <label>Set<input id="setName" maxlength="120" /></label>
        <label>Card #<input id="cardNumber" maxlength="40" /></label>
        <label>Parallel / variation<input id="parallel" maxlength="100" /></label>
        <label>Serial number<input id="serialNumber" maxlength="40" placeholder="17/99" /></label>
        <label>Team / club<input id="team" maxlength="100" /></label>
        <label>League<input id="league" maxlength="80" /></label>
        <label>Condition<select id="condition"><option>Raw — unknown</option><option>Near Mint</option><option>Lightly Played</option><option>Moderately Played</option><option>Heavily Played</option><option>Damaged</option></select></label>
        <label>Quantity<input id="quantity" type="number" min="1" max="999" value="1" /></label>
        <label>Cost basis / card ($)<input id="costBasis" type="number" min="0" step="0.01" /></label>
        <label>Acquired from<input id="acquisitionSource" maxlength="100" placeholder="Topps, eBay, card show…" /></label>
        <label>Acquisition date<input id="acquisitionDate" type="date" /></label>
        <label>Manual value ($)<input id="manualValue" type="number" min="0" step="0.01" /></label>
        <label>Grading company<select id="gradingCompany"><option value="">Raw / none</option><option>PSA</option><option>BGS</option><option>CGC</option><option>SGC</option><option>TAG</option><option>Other</option></select></label>
        <label>Grade<input id="grade" maxlength="20" placeholder="10, 9.5…" /></label>
        <label>Certification #<input id="certNumber" maxlength="80" /></label>
      </div>
      <div class="flag-row"><label><input id="rookie" type="checkbox" /> Rookie / RC</label><label><input id="autograph" type="checkbox" /> Autograph</label><label><input id="relic" type="checkbox" /> Relic / memorabilia</label></div>
      <label>Notes<textarea id="notes" rows="3" maxlength="1000"></textarea></label>
      <div class="button-row spread"><button type="button" id="deleteCardBtn" class="btn danger hidden">Delete</button><div class="button-row"><button value="cancel" class="btn secondary">Cancel</button><button type="button" id="saveCardBtn" class="btn primary">Save holding</button></div></div>
    </form>
  </dialog>
  <dialog id="scanReviewDialog" class="modal wide">
    <div class="modal-card">
      <div class="modal-head"><div><div class="eyebrow">Review before add</div><h2>Confirm scan</h2></div><button class="icon-btn" id="closeScanReview" aria-label="Close">×</button></div>
      <div class="scan-review-layout">
        <div><img id="scanReviewImage" class="scan-review-image" alt="Scanned card preview" /></div>
        <div>
          <div class="confidence-card"><span>OCR confidence</span><strong id="ocrConfidence">—</strong></div>
          <pre id="rawOcr" class="ocr-box"></pre>
          <div id="pokemonMatches" class="match-list"></div>
          <div class="button-row"><button id="matchPokemonBtn" class="btn secondary hidden">Match with TCGdex</button><button id="useScanBtn" class="btn primary">Use extracted fields</button></div>
        </div>
      </div>
    </div>
  </dialog>
</body>
</html>
