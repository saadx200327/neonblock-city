name: Cardfolio GPT vision gate

on:
  push:
    branches:
      - cardfolio-mvp
  pull_request:

permissions:
  contents: read

jobs:
  gpt-vision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_FUNCTION_URL: https://tvxwzkununcwxiwvrslh.supabase.co/functions/v1/card-vision
    steps:
      - uses: actions/checkout@v5

      - name: Verify private image-to-GPT contract
        shell: bash
        run: |
          set -euo pipefail
          node --check cardfolio-scan-review.js
          test ! -f api/card-vision.js
          test -f supabase/functions/card-vision/index.ts
          test -f supabase/migrations/20260907181100_card_vision_rate_limits.sql

          grep -Fq 'createClient' supabase/functions/card-vision/index.ts
          grep -Fq 'auth.getUser(token)' supabase/functions/card-vision/index.ts
          grep -Fq 'VAULT_SECRET_NAME = "cardfolio_openai_api_key"' supabase/functions/card-vision/index.ts
          grep -Fq 'Deno.env.get("OPENAI_API_KEY")' supabase/functions/card-vision/index.ts
          grep -Fq 'vault.decrypted_secrets' supabase/functions/card-vision/index.ts
          grep -Fq 'MAX_REQUESTS_PER_HOUR = 120' supabase/functions/card-vision/index.ts
          grep -Fq 'MAX_REQUESTS_PER_DAY = 500' supabase/functions/card-vision/index.ts
          grep -Fq 'store: false' supabase/functions/card-vision/index.ts
          grep -Fq 'detail: "high"' supabase/functions/card-vision/index.ts
          grep -Fq 'mode === "compare"' supabase/functions/card-vision/index.ts
          grep -Fq 'Do NOT price the card' supabase/functions/card-vision/index.ts
          grep -Fq "functions.invoke('card-vision'" cardfolio-scan-review.js
          grep -Fq 'needs_visual_analysis:false' cardfolio-scan-review.js
          grep -Fq 'confidence<0.78' cardfolio-scan-review.js
          grep -Fq "visionBackend:'supabase-edge'" api/config.js
          echo 'Vision source contract verified.'

      - name: Verify production worker enforces app-level authentication
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --connect-timeout 8 --max-time 20 -o /tmp/cardfolio-vision-body -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"mode":"identify"}' "$SUPABASE_FUNCTION_URL" || true)"
          echo "Supabase card-vision unauthenticated HTTP: ${status:-curl-error}"
          test "$status" = "401"
          node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/cardfolio-vision-body','utf8'));
          if(!/sign in/i.test(String(body.error||'')))process.exit(1);
          console.log('Production card-vision rejects callers without a real user session.');
          NODE

      - name: Confirm backend ownership and fail-closed behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "visionBackend:'supabase-edge'" api/config.js
          grep -Fq "functions.invoke('card-vision'" cardfolio-scan-review.js
          grep -Fq "configured: false" supabase/functions/card-vision/index.ts
          grep -Fq 'needs_visual_analysis:true' cardfolio-scan-review.js
          echo 'Cardfolio vision is Supabase-owned and fails closed when model credentials are unavailable.'
