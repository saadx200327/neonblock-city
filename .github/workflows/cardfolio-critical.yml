name: Cardfolio critical interactions

on:
  pull_request:
  push:
    branches:
      - cardfolio-mvp

permissions:
  contents: read

jobs:
  critical-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate critical patch syntax
        run: |
          node --check cardfolio-app.js
          node --check cardfolio-critical-fixes.js
          node --check cardfolio-exact-identity-client.js
          node --check cardfolio-production-guard.js
          node --check cardfolio-market-integrity.js

      - name: Validate Vercel source wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f vercel.json
          test -f api/config.js
          test -f api/ebay.js
          grep -Fq 'Strict-Transport-Security' vercel.json
          grep -Fq 'X-Content-Type-Options' vercel.json
          grep -Fq 'Referrer-Policy' vercel.json
          grep -Fq 'Permissions-Policy' vercel.json
          grep -Fq 'cardfolio-critical-fixes.js' index.html
          grep -Fq 'api/proxy?path=cardfolio-exact-identity-client.js' index.html
          grep -Fq 'api/proxy?path=cardfolio-production-guard.js' index.html
          grep -Fq "loadProxyCss('cardfolio-market-v2.css'" cardfolio-critical-fixes.js
          grep -Fq 'robustSaveHolding' cardfolio-critical-fixes.js
          grep -Fq 'signInWithOAuth' cardfolio-critical-fixes.js
          grep -Fq 'skipBrowserRedirect:true' cardfolio-critical-fixes.js
          grep -Fq "provider:'google'" cardfolio-critical-fixes.js
          grep -Fq 'Save failed' cardfolio-critical-fixes.js
          grep -Fq "'subset'" cardfolio-exact-identity-client.js
          grep -Fq "'variant_name'" cardfolio-exact-identity-client.js
          grep -Fq "'language'" cardfolio-exact-identity-client.js
          grep -Fq "'edition'" cardfolio-exact-identity-client.js
          grep -Fq 'tvxwzkununcwxiwvrslh.supabase.co' api/config.js
          grep -Fq "visionBackend:'expert-queue'" api/config.js
          grep -Fq 'paidVisionFallback:false' api/config.js
          grep -Fq "visionBackend:'expert-queue'" cardfolio-app.js
          grep -Fq 'paidVisionFallback:false' cardfolio-app.js
          if grep -Ein 'service[_-]?role|SUPABASE_SERVICE_ROLE' index.html cardfolio-*.js cardfolio*.css cardfolio-manifest.webmanifest; then
            echo 'Privileged Supabase credential reference found in browser-delivered files.' >&2
            exit 1
          fi

      - name: Validate live Vercel production
        if: github.event_name == 'push'
        shell: bash
        env:
          PRODUCTION_URL: https://saad-cardfolio-saadahmed0020-3481s-projects.vercel.app
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          root="$(mktemp)"
          body="$(mktemp)"
          config="$(mktemp)"
          script="$(mktemp)"
          trap 'rm -f "$headers" "$root" "$body" "$config" "$script"' EXIT

          # The live GitHub proxy can lag a push even after Vercel reports its shell
          # deployment complete. Give it a bounded propagation window and bypass caches.
          ready=0
          branch_sha="$(sha256sum index.html | cut -d' ' -f1)"
          for attempt in $(seq 1 12); do
            : > "$headers"
            : > "$root"
            : > "$body"
            nonce="${GITHUB_SHA}-${attempt}-$(date +%s)"
            root_status="$(curl -sS -L --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' -D "$headers" -o "$root" -w '%{http_code}' "$PRODUCTION_URL/?probe=$nonce" || true)"
            proxy_status="$(curl -sS -L --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$body" -w '%{http_code}' "$PRODUCTION_URL/api/proxy?path=index.html&sha=$GITHUB_SHA&probe=$nonce" || true)"
            proxy_sha="$(sha256sum "$body" | cut -d' ' -f1)"

            if [ "$root_status" = "200" ] \
              && [ "$proxy_status" = "200" ] \
              && grep -Fq '<title>Cardfolio</title>' "$root" \
              && grep -Fq "location.replace('/api/proxy?path=index.html')" "$root" \
              && grep -Eiq '^x-vercel-id:' "$headers" \
              && grep -Fq '<title>Cardfolio</title>' "$body" \
              && grep -Fq '/api/proxy?path=cardfolio-production-guard.js' "$body" \
              && [ "$branch_sha" = "$proxy_sha" ]; then
              ready=1
              break
            fi

            echo "Production proxy not current on attempt $attempt (root=${root_status:-curl-error}, proxy=${proxy_status:-curl-error}, branch=$branch_sha, live=$proxy_sha); retrying..."
            [ "$attempt" -eq 12 ] || sleep 10
          done

          if [ "$ready" -ne 1 ]; then
            echo 'Canonical Vercel shell or proxied Cardfolio app remained stale after bounded retries.' >&2
            echo "Root SHA-256: $(sha256sum "$root" | awk '{print $1}')" >&2
            echo "Proxy SHA-256: $(sha256sum "$body" | awk '{print $1}')" >&2
            echo "Branch index SHA-256: $branch_sha" >&2
            exit 1
          fi

          echo 'Validating every local script referenced by the live proxied index...'
          BODY_FILE="$body" node <<'NODE' > /tmp/cardfolio-local-scripts.txt
          const fs = require('fs');
          const html = fs.readFileSync(process.env.BODY_FILE, 'utf8');
          const urls = [...html.matchAll(/<script[^>]+src="([^"]+)"/g)].map(m => m[1]).filter(src => src.startsWith('/'));
          for (const url of [...new Set(urls)]) console.log(url);
          NODE

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            : > "$headers"
            joiner='?'; [[ "$path" == *\?* ]] && joiner='&'
            status="$(curl -sS -L --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' -D "$headers" -o "$script" -w '%{http_code}' "$PRODUCTION_URL${path}${joiner}probe=$GITHUB_SHA" || true)"
            test "$status" = "200"
            if ! grep -Eiq '^content-type: *(text|application)/javascript' "$headers"; then
              echo "Unexpected script MIME for $path" >&2
              grep -i '^content-type:' "$headers" >&2 || true
              exit 1
            fi
            echo "OK $path"
          done < /tmp/cardfolio-local-scripts.txt

          config_status="$(curl -sS -L --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' -D "$headers" -o "$config" -w '%{http_code}' "$PRODUCTION_URL/api/config?probe=$GITHUB_SHA" || true)"
          if [ "$config_status" != "200" ]; then
            echo "Production /api/config returned HTTP ${config_status:-curl-error}." >&2
            grep -Ei '^(content-type|x-vercel-error|x-vercel-id):' "$headers" >&2 || true
            exit 1
          fi
          CONFIG_FILE="$config" node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync(process.env.CONFIG_FILE, 'utf8');
          if (/service[_-]?role|SUPABASE_SERVICE_ROLE/i.test(raw)) {
            throw new Error('Privileged Supabase credential reference exposed by /api/config');
          }
          const cfg = JSON.parse(raw);
          if (cfg.supabaseUrl !== 'https://tvxwzkununcwxiwvrslh.supabase.co') {
            throw new Error(`Unexpected Supabase project URL: ${cfg.supabaseUrl}`);
          }
          if (typeof cfg.supabasePublishableKey !== 'string' || !cfg.supabasePublishableKey.startsWith('sb_publishable_')) {
            throw new Error('Production /api/config is not returning the expected publishable Supabase key type.');
          }
          if (cfg.visionBackend !== 'expert-queue') {
            throw new Error(`Unexpected production vision backend: ${cfg.visionBackend}`);
          }
          if (cfg.paidVisionFallback !== false) {
            throw new Error('Production paid vision fallback must remain disabled.');
          }
          NODE
