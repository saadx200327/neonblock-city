<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>Cardfolio</title>
  <style>html,body{margin:0;min-height:100%;background:#f4f7fb;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot strong{display:block;font-size:22px;margin-bottom:8px}.boot span{color:#667085}</style>
</head>
<body>
  <div class="boot"><div><strong>Opening Cardfolio…</strong><span>Loading the corrected save path.</span></div></div>
  <script>
  (async function(){
    try{
      const response=await fetch('/api/proxy?path=index.html&entry=20260907-intake-integrity-1',{cache:'no-store'});
      if(!response.ok) throw new Error('Cardfolio shell returned '+response.status);
      let html=await response.text();
      html=html.replace(/cardfolio-save-stack-guard\.js(?:&amp;|&)v=[^"'<>\s]+/g,'cardfolio-save-v2.js&v=20260907-intake-integrity-1')
               .replace(/cardfolio-save-stack-guard\.js/g,'cardfolio-save-v2.js&v=20260907-intake-integrity-1');
      if(!html.includes('cardfolio-save-v2.js')){
        html=html.replace('</head>','  <script defer src="/api/proxy?path=cardfolio-save-v2.js&v=20260907-intake-integrity-1"><'+'/script>\n</head>');
      }
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.body.innerHTML='<div class="boot"><div><strong>Could not open Cardfolio</strong><span>'+String(error&&error.message||error)+'</span></div></div>';
    }
  })();
  </script>
</body>
</html>
