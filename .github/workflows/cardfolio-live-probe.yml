name: Cardfolio live production probe

on:
  push:
    branches:
      - cardfolio-mvp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-production:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PRODUCTION_URL: https://saad-cardfolio-saadahmed0020-3481s-projects.vercel.app
      EXPECTED_SUPABASE_URL: https://tvxwzkununcwxiwvrslh.supabase.co
    steps:
      - uses: actions/checkout@v5

      - name: Probe canonical Vercel surfaces
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          config="$(mktemp)"
          remote="$(mktemp)"
          auth_settings="$(mktemp)"
          oauth_headers="$(mktemp)"
          trap 'rm -f "$headers" "$body" "$config" "$remote" "$auth_settings" "$oauth_headers"' EXIT

          root_status="$(curl -sS -L --connect-timeout 8 --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "$PRODUCTION_URL/" || true)"
          echo "root HTTP: ${root_status:-curl-error}"
          echo "root bytes: $(wc -c < "$body" | tr -d ' ')"
          test "$root_status" = "200"
          grep -Fq "location.replace('/api/proxy?path=index.html')" "$body"
          echo "root proxy bootstrap: verified"

          config_status="$(curl -sS -L --connect-timeout 8 --max-time 20 -o "$config" -w '%{http_code}' "$PRODUCTION_URL/api/config" || true)"
          echo "api/config HTTP: ${config_status:-curl-error}"
          test "$config_status" = "200"
          CONFIG_FILE="$config" EXPECTED_SUPABASE_URL="$EXPECTED_SUPABASE_URL" node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync(process.env.CONFIG_FILE, 'utf8');
          let cfg;
          try {
            cfg = JSON.parse(raw);
          } catch (error) {
            console.error('api/config must return valid JSON');
            process.exit(1);
          }

          const valid = {
            configured: cfg.configured === true,
            supabaseUrl: cfg.supabaseUrl === process.env.EXPECTED_SUPABASE_URL,
            publishableKey: typeof cfg.supabasePublishableKey === 'string' && cfg.supabasePublishableKey.startsWith('sb_publishable_'),
            noServiceRole: !('supabaseServiceRoleKey' in cfg) && !('serviceRoleKey' in cfg) && !('SUPABASE_SERVICE_ROLE_KEY' in cfg)
          };
          console.log('api/config verification:', JSON.stringify(valid));
          if (!Object.values(valid).every(Boolean)) process.exit(1);
          NODE

          mapfile -t public_auth < <(CONFIG_FILE="$config" node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync(process.env.CONFIG_FILE, 'utf8'));
          console.log(cfg.supabaseUrl || '');
          console.log(cfg.supabasePublishableKey || '');
          NODE
          )
          supabase_url="${public_auth[0]:-}"
          publishable_key="${public_auth[1]:-}"
          test "$supabase_url" = "$EXPECTED_SUPABASE_URL"
          test -n "$publishable_key"

          auth_settings_status="$(curl -sS --connect-timeout 8 --max-time 20 \
            -H "apikey: $publishable_key" \
            -o "$auth_settings" -w '%{http_code}' \
            "$supabase_url/auth/v1/settings" || true)"
          echo "Supabase auth settings HTTP: ${auth_settings_status:-curl-error}"
          test "$auth_settings_status" = "200"
          AUTH_SETTINGS_FILE="$auth_settings" node <<'NODE'
          const fs = require('fs');
          let settings;
          try {
            settings = JSON.parse(fs.readFileSync(process.env.AUTH_SETTINGS_FILE, 'utf8'));
          } catch {
            console.error('Supabase auth settings must be valid JSON');
            process.exit(1);
          }
          const googleEnabled = settings?.external?.google === true;
          console.log(`Google provider enabled: ${googleEnabled}`);
          if (!googleEnabled) process.exit(1);
          NODE

          oauth_target="$PRODUCTION_URL/api/proxy?path=index.html"
          : > "$oauth_headers"
          oauth_status="$(curl -sS --connect-timeout 8 --max-time 20 --max-redirs 0 \
            -H "apikey: $publishable_key" \
            -D "$oauth_headers" -o /dev/null -w '%{http_code}' \
            --get --data-urlencode 'provider=google' --data-urlencode "redirect_to=$oauth_target" \
            "$supabase_url/auth/v1/authorize" || true)"
          echo "Google OAuth launch HTTP: ${oauth_status:-curl-error}"
          test "$oauth_status" = "302"
          oauth_location="$(grep -i '^location:' "$oauth_headers" | tail -n1 | sed -E 's/^[Ll]ocation:[[:space:]]*//' | tr -d '\r')"
          case "$oauth_location" in
            https://accounts.google.com/*|https://accounts.googleusercontent.com/*)
              echo 'Google OAuth provider launch: verified'
              ;;
            *)
              echo 'Google OAuth did not redirect to a Google authorization endpoint.' >&2
              exit 1
              ;;
          esac

          assets=(
            cardfolio-manifest.webmanifest
            cardfolio-icon.svg
            cardfolio.css
            cardfolio-vnext.css
            cardfolio-liquid.css
            cardfolio-app.js
            cardfolio-app-2.js
            cardfolio-app-3.js
            cardfolio-app-4.js
            cardfolio-fixes.js
            cardfolio-watchlist.js
            cardfolio-grading.js
            cardfolio-valuation-integrity.js
            cardfolio-scan-review.js
            cardfolio-vnext.js
            cardfolio-product.js
            cardfolio-product-fixes.js
            cardfolio-runtime-hardening.js
            cardfolio-critical-fixes.js
            cardfolio-commercial.js
            cardfolio-identity-persistence.js
            cardfolio-exact-identity-client.js
            cardfolio-production-guard.js
            cardfolio-market-integrity.js
          )

          echo 'asset audit:'
          for file in "${assets[@]}"; do
            direct_match=no
            proxy_match=no
            for asset_attempt in 1 2 3 4 5 6 7 8; do
              : > "$headers"
              direct_status="$(curl -sS -L --connect-timeout 8 --max-time 20 -D "$headers" -o "$remote" -w '%{http_code}' "$PRODUCTION_URL/$file" || true)"
              direct_type="$(grep -i '^content-type:' "$headers" | tail -n1 | tr -d '\r' | cut -d' ' -f2- || true)"
              direct_match=no
              if [ "$direct_status" = "200" ] && [ -f "$file" ] && [ "$(sha256sum "$file" | cut -d' ' -f1)" = "$(sha256sum "$remote" | cut -d' ' -f1)" ]; then direct_match=yes; fi

              : > "$headers"
              proxy_status="$(curl -sS -L --connect-timeout 8 --max-time 20 -D "$headers" -o "$remote" -w '%{http_code}' "$PRODUCTION_URL/api/proxy?path=$file" || true)"
              proxy_type="$(grep -i '^content-type:' "$headers" | tail -n1 | tr -d '\r' | cut -d' ' -f2- || true)"
              proxy_match=no
              if [ "$proxy_status" = "200" ] && [ -f "$file" ] && [ "$(sha256sum "$file" | cut -d' ' -f1)" = "$(sha256sum "$remote" | cut -d' ' -f1)" ]; then proxy_match=yes; fi

              printf '%s | attempt=%s | direct=%s match=%s type=%s | proxy=%s match=%s type=%s\n' "$file" "$asset_attempt" "${direct_status:-curl-error}" "$direct_match" "${direct_type:-?}" "${proxy_status:-curl-error}" "$proxy_match" "${proxy_type:-?}"
              if [ "$direct_match" = "yes" ] || [ "$proxy_match" = "yes" ]; then break; fi
              if [ "$asset_attempt" -lt 8 ]; then sleep 5; fi
            done

            if [ "$direct_match" != "yes" ] && [ "$proxy_match" != "yes" ]; then
              echo "Production asset mismatch after bounded propagation retries: $file" >&2
              exit 1
            fi
          done

          echo 'Cardfolio production probe passed with fail-closed verification.'
