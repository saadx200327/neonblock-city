name: Cardfolio save stack guard

on:
  push:
    branches:
      - cardfolio-mvp
  pull_request:

permissions:
  contents: read

jobs:
  verify-save-stack-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_URL: https://saad-cardfolio-saadahmed0020-3481s-projects.vercel.app
    steps:
      - uses: actions/checkout@v5

      - name: Validate save guard source and intake contract
        shell: bash
        run: |
          set -euo pipefail
          node --check cardfolio-save-stack-guard.js
          node --check cardfolio-save-v2.js
          node --check cardfolio-ui-prune.js
          node --check cardfolio-save-contract.test.cjs
          node cardfolio-save-contract.test.cjs
          grep -Fq 'definitiveSave' cardfolio-save-v2.js
          grep -Fq 'readPrimitiveForm' cardfolio-save-v2.js
          grep -Fq 'local_visual_signature' cardfolio-save-v2.js
          grep -Fq 'normalizeVariant' cardfolio-save-v2.js
          grep -Fq "document.addEventListener('click',interceptSave,true)" cardfolio-save-v2.js
          grep -Fq 'cardfolio-save-v2.js' cardfolio-live-fix-20260907.html
          if grep -Eq '(^|[^A-Za-z])readCardForm\(' cardfolio-save-v2.js; then
            echo 'Definitive save path must not call readCardForm.' >&2
            exit 1
          fi
          if grep -Eq '(^|[^A-Za-z])toDb\(' cardfolio-save-v2.js; then
            echo 'Definitive save path must not call toDb.' >&2
            exit 1
          fi

      - name: Verify uncached live Safari entry and save handler
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          remote="$(mktemp)"
          trap 'rm -f "$remote"' EXIT
          rev="${GITHUB_SHA}-${GITHUB_RUN_ID}"

          entry_ok=0
          guard_ok=0
          for attempt in $(seq 1 12); do
            entry_status="$(curl -sS -L --connect-timeout 8 --max-time 20 -o "$remote" -w '%{http_code}' "$PRODUCTION_URL/api/proxy?path=cardfolio-live-fix-20260907.html&rev=$rev-$attempt" || true)"
            if [ "$entry_status" = "200" ] && grep -Fq 'cardfolio-save-v2.js' "$remote" && grep -Fq '20260907-intake-integrity-1' "$remote"; then
              entry_ok=1
            fi

            guard_status="$(curl -sS -L --connect-timeout 8 --max-time 20 -o "$remote" -w '%{http_code}' "$PRODUCTION_URL/api/proxy?path=cardfolio-save-v2.js&rev=$rev-$attempt" || true)"
            if [ "$guard_status" = "200" ] && grep -Fq 'local_visual_signature' "$remote" && grep -Fq 'normalizeVariant' "$remote" && grep -Fq 'definitiveSave' "$remote"; then
              guard_ok=1
            fi

            echo "attempt=$attempt entry=$entry_status entry_ok=$entry_ok guard=$guard_status guard_ok=$guard_ok"
            if [ "$entry_ok" -eq 1 ] && [ "$guard_ok" -eq 1 ]; then break; fi
            sleep 5
          done

          test "$entry_ok" -eq 1
          test "$guard_ok" -eq 1
          echo 'Live uncached Safari entry preserves expert-review intake metadata and blocks legacy recursion.'

      - name: Report canonical index freshness
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          remote="$(mktemp)"
          trap 'rm -f "$remote"' EXIT
          status="$(curl -sS -L --connect-timeout 8 --max-time 20 -o "$remote" -w '%{http_code}' "$PRODUCTION_URL/api/proxy?path=index.html&fresh=${GITHUB_SHA}" || true)"
          if [ "$status" = "200" ] && grep -Fq '20260907-intake-integrity-1' "$remote"; then
            echo 'Canonical proxied index is current.'
          else
            echo 'WARNING: canonical proxied index is stale; uncached live entry remains the verified recovery path.'
          fi
