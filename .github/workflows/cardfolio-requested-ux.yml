name: Cardfolio requested UX

on:
  push:
    branches:
      - cardfolio-mvp
  pull_request:

permissions:
  contents: read

jobs:
  requested-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check cardfolio-critical-fixes.js
          node --check cardfolio-live-sync.js
          node --check cardfolio-requested-ux.test.js
      - name: Requested UX contract
        run: node cardfolio-requested-ux.test.js
