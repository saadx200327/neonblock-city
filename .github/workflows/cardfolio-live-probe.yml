name: Cardfolio live production probe

on:
  push:
    branches:
      - cardfolio-mvp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_URL: https://saad-cardfolio-saadahmed0020-3481s-projects.vercel.app
      EXPECTED_SUPABASE_URL: https://tvxwzkununcwxiwvrslh.supabase.co
    steps:
      - uses: actions/checkout@v5

      - name: Probe canonical Vercel surfaces
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          headers="$(mktemp)"
          root="$(mktemp)"
          proxied_index="$(mktemp)"
          config="$(mktemp)"
          remote="$(mktemp)"
          auth_settings="$(mktemp)"
          oauth_headers="$(mktemp)"
          assets_file="$(mktemp)"
          trap 'rm -f "$headers" "$root" "$proxied_index" "$config" "$remote" "$auth_settings" "$oauth_headers" "$assets_file"' EXIT

          # The canonical public host is intentionally a tiny stable shell which opens
          # the branch application through /api/proxy. Validate the shell, but continue
          # diagnostics if it is broken so one failure cannot hide additional drift.
          root_status="$(curl -sS -L --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' -D "$headers" -o "$root" -w '%{http_code}' "$PRODUCTION_URL/?probe=$GITHUB_SHA" || true)"
          echo "root HTTP: ${root_status:-curl-error}"
          echo "root bytes: $(wc -c < "$root" | tr -d ' ')"
          grep -Ei '^(age|x-vercel-cache|x-vercel-id|x-matched-path|content-type):' "$headers" || true
          if [ "$root_status" != "200" ] || ! grep -Fq "location.replace('/api/proxy?path=index.html')" "$root"; then
            echo "::error::Canonical public bootstrap is unavailable or unexpected"
            failures=$((failures+1))
          else
            echo "root proxy bootstrap: verified"
          fi

          # GitHub/raw/Vercel proxy propagation can lag a branch push. Retry a bounded
          # window with unique query nonces. If still stale, mark the drift but switch to
          # the local index for expected-asset discovery so the remainder of the probe runs.
          local_index_sha="$(sha256sum index.html | awk '{print $1}')"
          index_current=0
          for index_attempt in $(seq 1 12); do
            : > "$headers"
            : > "$proxied_index"
            nonce="${GITHUB_SHA}-${index_attempt}-$(date +%s)"
            proxy_index_status="$(curl -sS -L --connect-timeout 8 --max-time 20 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              -D "$headers" -o "$proxied_index" -w '%{http_code}' \
              "$PRODUCTION_URL/api/proxy?path=index.html&sha=$GITHUB_SHA&probe=$nonce" || true)"
            remote_index_sha="$(sha256sum "$proxied_index" | awk '{print $1}')"
            cache_state="$(grep -i '^x-vercel-cache:' "$headers" | tail -n1 | tr -d '\r' | cut -d' ' -f2- || true)"
            age_state="$(grep -i '^age:' "$headers" | tail -n1 | tr -d '\r' | cut -d' ' -f2- || true)"
            echo "proxied index attempt=$index_attempt HTTP=${proxy_index_status:-curl-error} cache=${cache_state:-?} age=${age_state:-?} local=$local_index_sha remote=$remote_index_sha"
            if [ "$proxy_index_status" = "200" ] \
              && grep -Fq '<title>Cardfolio</title>' "$proxied_index" \
              && [ "$local_index_sha" = "$remote_index_sha" ]; then
              index_current=1
              break
            fi
            [ "$index_attempt" -eq 12 ] || sleep 10
          done
          if [ "$index_current" -ne 1 ]; then
            echo "::error::Canonical proxied index remained stale after bounded propagation retries"
            failures=$((failures+1))
            cp index.html "$proxied_index"
          else
            echo "proxied branch index: CURRENT"
          fi

          # /api/config is serverless state owned by the canonical Vercel shell. Record
          # its failure but continue probing auth and every browser asset so one P0 does
          # not hide additional production drift.
          : > "$headers"
          config_status="$(curl -sS -L --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' -D "$headers" -o "$config" -w '%{http_code}' "$PRODUCTION_URL/api/config?sha=$GITHUB_SHA&probe=$(date +%s)" || true)"
          echo "api/config HTTP: ${config_status:-curl-error}"
          grep -Ei '^(age|x-vercel-cache|x-vercel-id|x-matched-path|cache-control|content-type):' "$headers" || true
          if [ "$config_status" != "200" ]; then
            echo "::error::Canonical /api/config is not HTTP 200"
            failures=$((failures+1))
          fi

          if ! CONFIG_FILE="$config" EXPECTED_SUPABASE_URL="$EXPECTED_SUPABASE_URL" node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync(process.env.CONFIG_FILE, 'utf8');
          let cfg;
          try {
            cfg = JSON.parse(raw);
          } catch {
            console.error('api/config must return valid JSON');
            process.exit(1);
          }

          if (/service[_-]?role|SUPABASE_SERVICE_ROLE/i.test(raw)) {
            console.error('Privileged Supabase credential reference exposed by /api/config');
            process.exit(1);
          }

          // Print keys only, never config values/credentials.
          console.log('api/config keys:', Object.keys(cfg).sort().join(','));
          const valid = {
            configured: cfg.configured === true,
            supabaseUrl: cfg.supabaseUrl === process.env.EXPECTED_SUPABASE_URL,
            publishableKey: typeof cfg.supabasePublishableKey === 'string' && cfg.supabasePublishableKey.startsWith('sb_publishable_'),
            visionBackend: cfg.visionBackend === 'expert-queue',
            paidVisionFallback: cfg.paidVisionFallback === false,
            noServiceRole: !('supabaseServiceRoleKey' in cfg) && !('serviceRoleKey' in cfg) && !('SUPABASE_SERVICE_ROLE_KEY' in cfg)
          };
          console.log('api/config verification:', JSON.stringify(valid));
          if (!Object.values(valid).every(Boolean)) process.exit(1);
          NODE
          then
            echo "::error::Canonical /api/config does not satisfy Cardfolio's fail-closed public contract"
            failures=$((failures+1))
          fi

          # Connectivity/auth can still be diagnosed from the stale shell's public
          # Supabase URL + publishable key without treating that shell as healthy.
          mapfile -t public_auth < <(CONFIG_FILE="$config" node <<'NODE'
          const fs = require('fs');
          let cfg={};
          try { cfg=JSON.parse(fs.readFileSync(process.env.CONFIG_FILE, 'utf8')); } catch {}
          console.log(cfg.supabaseUrl || '');
          console.log(cfg.supabasePublishableKey || '');
          NODE
          )
          supabase_url="${public_auth[0]:-}"
          publishable_key="${public_auth[1]:-}"
          if [ "$supabase_url" = "$EXPECTED_SUPABASE_URL" ] && [ -n "$publishable_key" ]; then
            auth_settings_status="$(curl -sS --connect-timeout 8 --max-time 20 \
              -H "apikey: $publishable_key" \
              -o "$auth_settings" -w '%{http_code}' \
              "$supabase_url/auth/v1/settings" || true)"
            echo "Supabase auth settings HTTP: ${auth_settings_status:-curl-error}"
            if [ "$auth_settings_status" = "200" ]; then
              if ! AUTH_SETTINGS_FILE="$auth_settings" node <<'NODE'
          const fs = require('fs');
          let settings;
          try {
            settings = JSON.parse(fs.readFileSync(process.env.AUTH_SETTINGS_FILE, 'utf8'));
          } catch {
            console.error('Supabase auth settings must be valid JSON');
            process.exit(1);
          }
          const googleEnabled = settings?.external?.google === true;
          console.log(`Google provider enabled: ${googleEnabled}`);
          if (!googleEnabled) process.exit(1);
          NODE
              then
                echo "::error::Google auth provider health check failed"
                failures=$((failures+1))
              fi
            else
              echo "::error::Supabase auth settings request failed"
              failures=$((failures+1))
            fi

            oauth_target="$PRODUCTION_URL/api/proxy?path=index.html"
            : > "$oauth_headers"
            oauth_status="$(curl -sS --connect-timeout 8 --max-time 20 --max-redirs 0 \
              -H "apikey: $publishable_key" \
              -D "$oauth_headers" -o /dev/null -w '%{http_code}' \
              --get --data-urlencode 'provider=google' --data-urlencode "redirect_to=$oauth_target" \
              "$supabase_url/auth/v1/authorize" || true)"
            echo "Google OAuth launch HTTP: ${oauth_status:-curl-error}"
            oauth_location="$(grep -i '^location:' "$oauth_headers" | tail -n1 | sed -E 's/^[Ll]ocation:[[:space:]]*//' | tr -d '\r' || true)"
            case "$oauth_status|$oauth_location" in
              302\|https://accounts.google.com/*|302\|https://accounts.googleusercontent.com/*)
                echo 'Google OAuth provider launch: verified'
                ;;
              *)
                echo '::error::Google OAuth did not redirect to a Google authorization endpoint.'
                failures=$((failures+1))
                ;;
            esac
          else
            echo "::error::Cannot continue auth diagnostics because canonical public Supabase connectivity fields are invalid"
            failures=$((failures+1))
          fi

          # Discover every browser-delivered local CSS/JS/manifest asset from the exact
          # expected branch index, then compare the live response byte-for-byte.
          INDEX_FILE="$proxied_index" node <<'NODE' > "$assets_file"
          const fs = require('fs');
          const html = fs.readFileSync(process.env.INDEX_FILE, 'utf8');
          const refs = [];
          for (const m of html.matchAll(/<(?:script|link)\b[^>]*(?:src|href)="([^"]+)"[^>]*>/gi)) {
            const value = m[1];
            if (!value.startsWith('/')) continue;
            if (value.startsWith('/api/cardfolio-icon')) continue;
            refs.push(value);
          }
          for (const value of [...new Set(refs)]) console.log(value);
          NODE

          echo 'live index asset audit:'
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            local_path=''
            if [[ "$ref" == /api/proxy\?path=* ]]; then
              local_path="${ref#*path=}"
              local_path="${local_path%%&*}"
            else
              local_path="${ref%%\?*}"
              local_path="${local_path#/}"
            fi

            if [ -z "$local_path" ] || [ ! -f "$local_path" ]; then
              echo "SKIP dynamic/non-repo $ref"
              continue
            fi

            matched=no
            mime_ok=no
            for asset_attempt in 1 2 3 4 5 6; do
              : > "$headers"
              nonce="${GITHUB_SHA}-${asset_attempt}-$(date +%s)"
              joiner='?'
              [[ "$ref" == *\?* ]] && joiner='&'
              status="$(curl -sS -L --connect-timeout 8 --max-time 20 \
                -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                -D "$headers" -o "$remote" -w '%{http_code}' "$PRODUCTION_URL${ref}${joiner}probe=${nonce}" || true)"
              content_type="$(grep -i '^content-type:' "$headers" | tail -n1 | tr -d '\r' | cut -d' ' -f2- || true)"
              cache_state="$(grep -i '^x-vercel-cache:' "$headers" | tail -n1 | tr -d '\r' | cut -d' ' -f2- || true)"
              local_asset_sha="$(sha256sum "$local_path" | awk '{print $1}')"
              remote_asset_sha="$(sha256sum "$remote" | awk '{print $1}')"
              mime_ok=yes
              case "$local_path" in
                *.css) [[ "$content_type" == text/css* ]] || mime_ok=no ;;
                *.js) [[ "$content_type" == *javascript* ]] || mime_ok=no ;;
                *.webmanifest) [[ "$content_type" == *manifest* || "$content_type" == application/json* ]] || mime_ok=no ;;
              esac
              if [ "$status" = "200" ] && [ "$local_asset_sha" = "$remote_asset_sha" ] && [ "$mime_ok" = yes ]; then
                matched=yes
                printf 'OK %s -> %s (%s cache=%s)\n' "$ref" "$local_path" "${content_type:-?}" "${cache_state:-?}"
                break
              fi
              printf 'WAIT %s attempt=%s HTTP=%s type=%s mime_ok=%s cache=%s local=%s remote=%s\n' "$ref" "$asset_attempt" "${status:-curl-error}" "${content_type:-?}" "$mime_ok" "${cache_state:-?}" "$local_asset_sha" "$remote_asset_sha"
              [ "$asset_attempt" -eq 6 ] || sleep 5
            done
            if [ "$matched" != yes ]; then
              echo "::error::Production asset mismatch or unsafe MIME: $ref -> $local_path"
              failures=$((failures+1))
            fi
          done < "$assets_file"

          echo "production probe failures: $failures"
          if [ "$failures" -ne 0 ]; then
            echo 'Cardfolio production probe detected unresolved drift.'
            exit 1
          fi
          echo 'Cardfolio production probe passed with fail-closed config + exact asset verification.'
